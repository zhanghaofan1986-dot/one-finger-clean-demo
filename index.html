<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>一指洗净 · One Finger Clean</title>
  <style>
    :root {
      --bg: #0f1419;
      --phone: #1a2332;
      --accent: #3dd6c6;
      --accent-dim: #2a9d8f;
      --warn: #f4a261;
      --text: #e8eef4;
      --muted: #8b9aab;
      --dirt: #5c4033;
      --surface: #c8d6e5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      overflow: hidden;
      user-select: none;
    }
    .wrap {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .phone {
      width: min(100%, 420px);
      height: min(100%, 860px);
      background: linear-gradient(165deg, #243044 0%, var(--phone) 40%);
      border-radius: 28px;
      border: 2px solid #2e3d52;
      box-shadow: 0 20px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    header {
      padding: 14px 16px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }
    h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: .02em;
    }
    h1 span { color: var(--accent); }
    .level-badge {
      font-size: .8rem;
      color: var(--muted);
      background: rgba(255,255,255,.06);
      padding: 4px 10px;
      border-radius: 999px;
    }
    .progress-block { display: flex; flex-direction: column; gap: 4px; }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: .75rem;
      color: var(--muted);
    }
    .progress-meta strong { color: var(--accent); font-size: .95rem; }
    .bar {
      height: 8px;
      background: rgba(0,0,0,.35);
      border-radius: 999px;
      overflow: hidden;
    }
    .bar > i {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-dim), var(--accent));
      border-radius: 999px;
      transition: width .08s linear;
    }
    .stage {
      flex: 1;
      position: relative;
      margin: 0 12px;
      border-radius: 18px;
      overflow: hidden;
      background: var(--surface);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.15);
      cursor: crosshair;
      min-height: 200px;
    }
    .stage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #baseCanvas { z-index: 1; }
    #dirtCanvas { z-index: 2; touch-action: none; }
    .hint {
      position: absolute;
      z-index: 3;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      text-align: center;
      color: rgba(255,255,255,.92);
      text-shadow: 0 2px 8px rgba(0,0,0,.55);
      font-size: .95rem;
      opacity: 1;
      transition: opacity .4s;
      padding: 10px 14px;
      background: rgba(0,0,0,.35);
      border-radius: 12px;
      max-width: 80%;
    }
    .hint.hidden { opacity: 0; }
    .cleared-overlay {
      position: absolute;
      z-index: 4;
      inset: 0;
      background: rgba(15, 40, 36, .72);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      backdrop-filter: blur(2px);
    }
    .cleared-overlay.show { display: flex; }
    .cleared-overlay h2 {
      font-size: 1.6rem;
      color: var(--accent);
    }
    .cleared-overlay p { color: var(--text); font-size: .9rem; }
    footer {
      padding: 12px 16px 16px;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    button {
      flex: 1;
      min-width: 100px;
      border: none;
      border-radius: 12px;
      padding: 12px 10px;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text);
      background: #2a384c;
      transition: transform .1s, background .15s;
    }
    button:active { transform: scale(.97); }
    button.primary {
      background: linear-gradient(135deg, var(--accent-dim), var(--accent));
      color: #062a26;
    }
    button.secondary {
      background: rgba(244, 162, 97, .2);
      color: var(--warn);
      border: 1px solid rgba(244, 162, 97, .35);
    }
    button:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
    }
    .toast {
      position: absolute;
      z-index: 10;
      left: 50%;
      bottom: 88px;
      transform: translateX(-50%) translateY(12px);
      background: rgba(0,0,0,.78);
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: .8rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s, transform .25s;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="phone" id="phone">
      <header>
        <div class="title-row">
          <h1>一指<span>洗净</span></h1>
          <div class="level-badge" id="levelBadge">第 1 / 3 关</div>
        </div>
        <div class="progress-block">
          <div class="progress-meta">
            <span>清洁进度</span>
            <strong id="pctLabel">0%</strong>
          </div>
          <div class="bar"><i id="pctBar"></i></div>
        </div>
      </header>

      <div class="stage" id="stage">
        <canvas id="baseCanvas"></canvas>
        <canvas id="dirtCanvas"></canvas>
        <div class="hint" id="hint">用手指 / 鼠标拖着擦掉脏污</div>
        <div class="cleared-overlay" id="cleared">
          <h2>✨ 擦干净啦！</h2>
          <p id="clearedMsg">进入下一关</p>
        </div>
      </div>

      <footer>
        <button type="button" class="secondary" id="btnNextDay" title="当前关脏污略回升">模拟次日</button>
        <button type="button" id="btnReset">重擦本关</button>
        <button type="button" class="primary" id="btnNext" disabled>下一关</button>
      </footer>
      <div class="toast" id="toast"></div>
    </div>
  </div>

  <script>
(function () {
  'use strict';

  const CLEAR_THRESHOLD = 0.98;
  const BRUSH_RADIUS = 28;
  const SAMPLE_STEP = 4;

  const levels = [
    {
      name: '斑点泼洒',
      base: { top: '#dfe9f3', bottom: '#b8c9dc' },
      drawDirt(ctx, w, h) {
        ctx.fillStyle = 'rgba(72, 48, 32, 0.88)';
        const spots = [
          [0.22, 0.28, 0.12], [0.55, 0.22, 0.09], [0.78, 0.35, 0.14],
          [0.35, 0.48, 0.11], [0.62, 0.55, 0.13], [0.18, 0.62, 0.10],
          [0.48, 0.72, 0.15], [0.82, 0.68, 0.10], [0.30, 0.85, 0.09],
          [0.70, 0.42, 0.08], [0.42, 0.18, 0.07], [0.88, 0.18, 0.06],
        ];
        for (const [nx, ny, nr] of spots) {
          ctx.beginPath();
          ctx.ellipse(nx * w, ny * h, nr * w, nr * w * 0.85, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        // soft smear blobs
        ctx.fillStyle = 'rgba(90, 60, 40, 0.55)';
        for (let i = 0; i < 18; i++) {
          const x = ((i * 97) % 100) / 100 * w;
          const y = ((i * 53) % 100) / 100 * h;
          const r = 8 + (i % 5) * 4;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
        }
      },
    },
    {
      name: '斜条污渍',
      base: { top: '#e8f0e8', bottom: '#c5d4c8' },
      drawDirt(ctx, w, h) {
        ctx.lineCap = 'round';
        const stripes = [
          { y: 0.15, thick: 22, alpha: 0.85 },
          { y: 0.32, thick: 28, alpha: 0.78 },
          { y: 0.50, thick: 18, alpha: 0.9 },
          { y: 0.68, thick: 32, alpha: 0.72 },
          { y: 0.85, thick: 20, alpha: 0.82 },
        ];
        for (const s of stripes) {
          ctx.strokeStyle = `rgba(55, 40, 28, ${s.alpha})`;
          ctx.lineWidth = s.thick;
          ctx.beginPath();
          ctx.moveTo(-20, s.y * h - w * 0.15);
          ctx.lineTo(w + 20, s.y * h + w * 0.25);
          ctx.stroke();
        }
        ctx.fillStyle = 'rgba(70, 45, 30, 0.65)';
        for (let i = 0; i < 10; i++) {
          ctx.beginPath();
          ctx.arc((0.1 + i * 0.09) * w, (0.2 + (i % 3) * 0.25) * h, 14 + i % 8, 0, Math.PI * 2);
          ctx.fill();
        }
      },
    },
    {
      name: '角落堆积',
      base: { top: '#f3ebe0', bottom: '#d4c4b0' },
      drawDirt(ctx, w, h) {
        const piles = [
          { x: 0, y: 0, rw: 0.45, rh: 0.38 },
          { x: 1, y: 0, rw: 0.35, rh: 0.42 },
          { x: 0, y: 1, rw: 0.5, rh: 0.4 },
          { x: 1, y: 1, rw: 0.42, rh: 0.35 },
          { x: 0.5, y: 0.55, rw: 0.28, rh: 0.22 },
        ];
        for (const p of piles) {
          const cx = p.x * w;
          const cy = p.y * h;
          const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(p.rw * w, p.rh * h));
          grd.addColorStop(0, 'rgba(48, 32, 22, 0.95)');
          grd.addColorStop(0.55, 'rgba(70, 48, 32, 0.75)');
          grd.addColorStop(1, 'rgba(70, 48, 32, 0)');
          ctx.fillStyle = grd;
          ctx.beginPath();
          ctx.ellipse(cx, cy, p.rw * w, p.rh * h, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = 'rgba(60, 40, 28, 0.7)';
        const crumbs = [[0.12,0.15],[0.88,0.12],[0.1,0.88],[0.9,0.9],[0.55,0.48],[0.4,0.6],[0.7,0.35]];
        for (const [nx, ny] of crumbs) {
          ctx.beginPath();
          ctx.arc(nx * w, ny * h, 10 + Math.random() * 8, 0, Math.PI * 2);
          ctx.fill();
        }
      },
    },
  ];

  const baseCanvas = document.getElementById('baseCanvas');
  const dirtCanvas = document.getElementById('dirtCanvas');
  const baseCtx = baseCanvas.getContext('2d');
  const dirtCtx = dirtCanvas.getContext('2d', { willReadFrequently: true });
  const stage = document.getElementById('stage');
  const pctLabel = document.getElementById('pctLabel');
  const pctBar = document.getElementById('pctBar');
  const levelBadge = document.getElementById('levelBadge');
  const hint = document.getElementById('hint');
  const cleared = document.getElementById('cleared');
  const clearedMsg = document.getElementById('clearedMsg');
  const btnNext = document.getElementById('btnNext');
  const btnReset = document.getElementById('btnReset');
  const btnNextDay = document.getElementById('btnNextDay');
  const toastEl = document.getElementById('toast');

  let levelIndex = 0;
  let initialOpaque = 0;
  let wiping = false;
  let lastX = 0, lastY = 0;
  let clearedOnce = false;
  let audioCtx = null;
  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  let toastTimer = null;

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playClearSound() {
    const ctx = ensureAudio();
    if (!ctx) return;
    const now = ctx.currentTime;
    // cheerful ascending chime
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const t0 = now + i * 0.09;
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(0.22, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.35);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.4);
    });
  }

  function sizeCanvases() {
    const rect = stage.getBoundingClientRect();
    const w = Math.max(1, Math.floor(rect.width));
    const h = Math.max(1, Math.floor(rect.height));
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    for (const c of [baseCanvas, dirtCanvas]) {
      c.width = Math.floor(w * dpr);
      c.height = Math.floor(h * dpr);
      c.style.width = w + 'px';
      c.style.height = h + 'px';
    }
    baseCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dirtCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { w, h };
  }

  function drawBase(w, h) {
    const lv = levels[levelIndex];
    const g = baseCtx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, lv.base.top);
    g.addColorStop(1, lv.base.bottom);
    baseCtx.fillStyle = g;
    baseCtx.fillRect(0, 0, w, h);

    // subtle tile / surface pattern (procedural, no assets)
    baseCtx.strokeStyle = 'rgba(0,0,0,0.04)';
    baseCtx.lineWidth = 1;
    const step = 28;
    for (let x = 0; x <= w; x += step) {
      baseCtx.beginPath();
      baseCtx.moveTo(x, 0);
      baseCtx.lineTo(x, h);
      baseCtx.stroke();
    }
    for (let y = 0; y <= h; y += step) {
      baseCtx.beginPath();
      baseCtx.moveTo(0, y);
      baseCtx.lineTo(w, y);
      baseCtx.stroke();
    }

    // center decorative SVG-like icon (circle + sparkle)
    baseCtx.save();
    baseCtx.translate(w / 2, h / 2);
    baseCtx.strokeStyle = 'rgba(255,255,255,0.35)';
    baseCtx.fillStyle = 'rgba(255,255,255,0.18)';
    baseCtx.lineWidth = 3;
    baseCtx.beginPath();
    baseCtx.arc(0, 0, Math.min(w, h) * 0.12, 0, Math.PI * 2);
    baseCtx.fill();
    baseCtx.stroke();
    baseCtx.fillStyle = 'rgba(61, 214, 198, 0.35)';
    baseCtx.beginPath();
    baseCtx.moveTo(0, -18);
    baseCtx.lineTo(5, -5);
    baseCtx.lineTo(18, 0);
    baseCtx.lineTo(5, 5);
    baseCtx.lineTo(0, 18);
    baseCtx.lineTo(-5, 5);
    baseCtx.lineTo(-18, 0);
    baseCtx.lineTo(-5, -5);
    baseCtx.closePath();
    baseCtx.fill();
    baseCtx.restore();

    baseCtx.fillStyle = 'rgba(0,0,0,0.28)';
    baseCtx.font = '600 14px sans-serif';
    baseCtx.textAlign = 'center';
    baseCtx.fillText(lv.name, w / 2, h - 18);
  }

  function paintDirtLayer(w, h) {
    dirtCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dirtCtx.clearRect(0, 0, w, h);
    dirtCtx.globalCompositeOperation = 'source-over';
    levels[levelIndex].drawDirt(dirtCtx, w, h);
  }

  function countOpaque() {
    const { width, height } = dirtCanvas;
    const data = dirtCtx.getImageData(0, 0, width, height).data;
    let n = 0;
    const step = SAMPLE_STEP * 4;
    for (let i = 3; i < data.length; i += step) {
      if (data[i] > 20) n++;
    }
    return n;
  }

  function updateProgress() {
    if (initialOpaque <= 0) {
      pctLabel.textContent = '100%';
      pctBar.style.width = '100%';
      return 1;
    }
    const left = countOpaque();
    const cleaned = Math.max(0, 1 - left / initialOpaque);
    const pct = Math.min(100, Math.round(cleaned * 100));
    pctLabel.textContent = pct + '%';
    pctBar.style.width = pct + '%';
    return cleaned;
  }

  function onCleared() {
    if (clearedOnce) return;
    clearedOnce = true;
    playClearSound();
    cleared.classList.add('show');
    const isLast = levelIndex >= levels.length - 1;
    clearedMsg.textContent = isLast ? '全部关卡完成！可点「重擦本关」或「模拟次日」' : '点击「下一关」继续';
    btnNext.disabled = isLast;
    if (isLast) btnNext.textContent = '已通关';
    else btnNext.textContent = '下一关';
    showToast('通关！');
  }

  function loadLevel(idx, opts) {
    opts = opts || {};
    levelIndex = ((idx % levels.length) + levels.length) % levels.length;
    clearedOnce = false;
    cleared.classList.remove('show');
    btnNext.disabled = true;
    btnNext.textContent = '下一关';
    hint.classList.remove('hidden');
    levelBadge.textContent = '第 ' + (levelIndex + 1) + ' / ' + levels.length + ' 关 · ' + levels[levelIndex].name;

    const { w, h } = sizeCanvases();
    drawBase(w, h);
    paintDirtLayer(w, h);
    initialOpaque = countOpaque();

    if (opts.partialDirt) {
      // "next day": lightly re-soil without full reset — already painted full dirt;
      // instead wipe most then re-add a light layer. If coming from cleaned state,
      // paintDirt already did full; we instead reduce opacity by wiping lightly first...
      // Better approach: after full paint, punch out ~55% with random large erasers
      // so dirt "returns a bit" relative to a clean surface when called after clear.
      // When called via btnNextDay we want CURRENT dirt to rise a bit.
      // Handled in simulateNextDay separately.
    }

    updateProgress();
  }

  function simulateNextDay() {
    ensureAudio();
    const { width: cw, height: ch } = dirtCanvas;
    const w = cw / dpr;
    const h = ch / dpr;

    // Re-add a light dirt wash on top of whatever remains (partial return)
    dirtCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dirtCtx.globalCompositeOperation = 'source-over';
    dirtCtx.fillStyle = 'rgba(70, 48, 32, 0.35)';
    // scatter soft blobs — not a full reset
    const count = 14;
    for (let i = 0; i < count; i++) {
      const x = Math.random() * w;
      const y = Math.random() * h;
      const r = 20 + Math.random() * 40;
      const g = dirtCtx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(55, 38, 25, 0.55)');
      g.addColorStop(1, 'rgba(55, 38, 25, 0)');
      dirtCtx.fillStyle = g;
      dirtCtx.beginPath();
      dirtCtx.arc(x, y, r, 0, Math.PI * 2);
      dirtCtx.fill();
    }
    // also re-draw a thinned version of level pattern at low alpha
    dirtCtx.globalAlpha = 0.28;
    levels[levelIndex].drawDirt(dirtCtx, w, h);
    dirtCtx.globalAlpha = 1;

    // Recalibrate baseline so progress reflects new dirt pile (keep max of old initial)
    const nowOpaque = countOpaque();
    initialOpaque = Math.max(initialOpaque, nowOpaque);
    clearedOnce = false;
    cleared.classList.remove('show');
    btnNext.disabled = true;
    btnNext.textContent = '下一关';
    updateProgress();
    showToast('过夜了…又脏了一点（假时钟）');
  }

  function eraseAt(x, y) {
    dirtCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dirtCtx.globalCompositeOperation = 'destination-out';
    dirtCtx.beginPath();
    dirtCtx.arc(x, y, BRUSH_RADIUS, 0, Math.PI * 2);
    dirtCtx.fill();

    if (lastX !== null) {
      dirtCtx.lineCap = 'round';
      dirtCtx.lineJoin = 'round';
      dirtCtx.lineWidth = BRUSH_RADIUS * 2;
      dirtCtx.beginPath();
      dirtCtx.moveTo(lastX, lastY);
      dirtCtx.lineTo(x, y);
      dirtCtx.stroke();
    }
    lastX = x;
    lastY = y;
  }

  function clientToLocal(clientX, clientY) {
    const rect = dirtCanvas.getBoundingClientRect();
    return {
      x: clientX - rect.left,
      y: clientY - rect.top,
    };
  }

  function onPointerDown(e) {
    e.preventDefault();
    ensureAudio();
    hint.classList.add('hidden');
    wiping = true;
    const p = clientToLocal(e.clientX, e.clientY);
    lastX = p.x;
    lastY = p.y;
    eraseAt(p.x, p.y);
    const cleaned = updateProgress();
    if (cleaned >= CLEAR_THRESHOLD) onCleared();
    if (dirtCanvas.setPointerCapture) {
      try { dirtCanvas.setPointerCapture(e.pointerId); } catch (_) {}
    }
  }

  function onPointerMove(e) {
    if (!wiping) return;
    e.preventDefault();
    const p = clientToLocal(e.clientX, e.clientY);
    eraseAt(p.x, p.y);
    const cleaned = updateProgress();
    if (cleaned >= CLEAR_THRESHOLD) onCleared();
  }

  function onPointerUp(e) {
    wiping = false;
    lastX = null;
    lastY = null;
  }

  dirtCanvas.addEventListener('pointerdown', onPointerDown);
  dirtCanvas.addEventListener('pointermove', onPointerMove);
  dirtCanvas.addEventListener('pointerup', onPointerUp);
  dirtCanvas.addEventListener('pointercancel', onPointerUp);
  dirtCanvas.addEventListener('pointerleave', (e) => {
    if (wiping) onPointerUp(e);
  });

  btnNext.addEventListener('click', () => {
    if (levelIndex < levels.length - 1) {
      loadLevel(levelIndex + 1);
      showToast('进入第 ' + (levelIndex + 1) + ' 关');
    }
  });
  btnReset.addEventListener('click', () => {
    loadLevel(levelIndex);
    showToast('本关已重置');
  });
  btnNextDay.addEventListener('click', () => simulateNextDay());

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      // preserve dirt roughly by reloading level (acceptable for demo)
      const wasCleared = clearedOnce;
      const pctBefore = parseInt(pctLabel.textContent, 10) || 0;
      loadLevel(levelIndex);
      if (wasCleared && pctBefore >= 98) {
        // leave fresh; user can re-wipe — toast
        showToast('窗口尺寸变了，本关已重绘');
      }
    }, 150);
  });

  // boot
  loadLevel(0);
})();
  </script>
</body>
</html>
